name: Frontend CI

# Encore V1.5 frontend (Phase 1). Runs the four gates the Phase 1 exit
# criteria require — lint, typecheck, unit test, production build — plus a
# bundle-size budget check. Triggered only on changes under frontend/.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # Build-time env validated by lib/env.ts (Zod). CI uses placeholders.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000/ws
      NEXT_PUBLIC_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle-size budget
        # Customer surface budget <200KB gzip / ops <350KB (Phase 16). This
        # is a coarse first-line guard on the total .next build output; the
        # per-route-group budget is enforced with a dedicated analyzer in
        # Phase 16.
        run: |
          SIZE_KB=$(du -sk .next | cut -f1)
          echo "Total .next size: ${SIZE_KB} KB"
          # Generous ceiling for the whole build artifact at Phase 1.
          if [ "$SIZE_KB" -gt 512000 ]; then
            echo "::error::.next build exceeds 500MB budget ceiling (${SIZE_KB} KB)"
            exit 1
          fi
