name: CI

# Week 1 baseline: lint + test the Python packages/services that exist so
# far, and validate that the Compose infrastructure definition is well
# formed. As services are added under apps/, this workflow's matrix grows
# to cover them — the structure here is deliberately generic so adding a
# new service means adding a path, not rewriting the workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-python:
    name: Lint & test Python packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/common
          - packages/cache
          - apps/api-gateway
          # Add each new Python package/service directory here as it's
          # built, e.g.:
          # - packages/id-generator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install encore-common and encore-cache
        # Every service imports packages/common (see docs/architecture/
        # service-boundaries.md). Installed first, unconditionally — a
        # second no-op install for the packages/common job itself is
        # harmless. Revisit with a workspace tool (uv/poetry workspaces)
        # per ADR-0002's follow-up if this grows unwieldy.
        run: |
          pip install -e packages/common
          pip install -e packages/cache

      - name: Install package + dev dependencies
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: ${{ matrix.package }}
        run: ruff check .

      - name: Test (pytest)
        working-directory: ${{ matrix.package }}
        run: pytest -v

  validate-compose:
    name: Validate docker-compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f infrastructure/docker/docker-compose.yml config -q

  lint-workflow:
    name: Sanity-check this workflow file itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
