[databases]
encore = host=postgres port=5432 dbname=encore auth_user=encore
shard_0 = host=postgres-shard-0 port=5432 dbname=encore_shard auth_user=encore
shard_1 = host=postgres-shard-1 port=5432 dbname=encore_shard auth_user=encore
shard_2 = host=postgres-shard-2 port=5432 dbname=encore_shard auth_user=encore
* = host=postgres port=5432 auth_user=encore

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = scram-sha-256
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
admin_users = postgres
