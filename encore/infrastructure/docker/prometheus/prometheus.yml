global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
  
  - job_name: "resale-engine"
    static_configs:
      - targets: ["resale-engine:8000"]
      
  - job_name: "checkout-service"
    static_configs:
      - targets: ["checkout-service:8003"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
