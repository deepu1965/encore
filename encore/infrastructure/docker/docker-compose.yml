version: "3.9"

# Encore V1 — local development infrastructure + services.
# Infra (Postgres, Redis, Kafka) landed Week 1. api-gateway landed Week 2.
# Remaining services (apps/inventory-service, apps/checkout-service, ...)
# are added to this file as they're built and split out of the Week 2
# monolith — see docs/decisions/0003-thin-vertical-slice-before-depth.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: encore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore_dev_only
      POSTGRES_DB: encore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: encore-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode — no Zookeeper needed. Fine for local
  # dev; a multi-broker setup is a Week 16/17 (Scaling / Sharding) concern,
  # not a Week 1 one.
  kafka:
    image: apache/kafka:3.7.0
    container_name: encore-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # First app service — added Week 2. Build context is the repo root
  # (`../..` from this file's location), not apps/api-gateway, because the
  # Dockerfile needs to COPY packages/common too. See
  # apps/api-gateway/Dockerfile's top comment.
  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: encore-api-gateway
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore_dev_only
      POSTGRES_DB: encore
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLASH_SALE_EVENT_IDS: ""
      HOLD_TTL_MINUTES: "5.0"
      EXPIRY_POLL_INTERVAL_SECS: "60"
      RATE_LIMIT_CHECKOUT_CAPACITY: "5000"
      RATE_LIMIT_CHECKOUT_PER_SECOND: "5000.0"
      RATE_LIMIT_GLOBAL_CAPACITY: "5000"
      RATE_LIMIT_GLOBAL_PER_SECOND: "5000.0"
      PAYMENT_SERVICE_URL: "http://payment-service:8002"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Virtual waiting room service — added Week 6.
  # Build context is the repo root (same pattern as api-gateway).
  waiting-room:
    build:
      context: ../..
      dockerfile: apps/waiting-room/Dockerfile
    container_name: encore-waiting-room
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SNOWFLAKE_WORKER_ID: "1"
      # Set FLASH_SALE_EVENT_IDS to enable waiting room for specific events:
      # FLASH_SALE_EVENT_IDS: "uuid1,uuid2"
      FLASH_SALE_EVENT_IDS: ""
      ADMISSION_BATCH_SIZE: "100"
      ADMISSION_INTERVAL_SECS: "5"
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional dev-only inspection tools — not part of the runtime system,
  # convenience only. Safe to comment out.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: encore-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  payment-service:
    build:
      context: ../..
      dockerfile: apps/payment-service/Dockerfile
    container_name: encore-payment-service
    restart: unless-stopped
    environment:
      DB_URI: postgresql://encore:encore_dev_only@postgres:5432/encore
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  checkout-service:
    build:
      context: ../../
      dockerfile: apps/checkout-service/Dockerfile
    container_name: encore-checkout-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/encore
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: encore-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.0.0
    container_name: encore-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: encore-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  postgres_data:
  kafka_data:
