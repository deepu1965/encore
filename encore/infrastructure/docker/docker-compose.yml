version: "3.9"

# Encore V1 — local development infrastructure baseline (Week 1).
# App services (api-gateway, inventory-service, ...) are added to this file
# as they're built, starting Week 2 with api-gateway. Until then this file
# brings up only the shared infrastructure every service depends on.

name: encore

services:
  postgres:
    image: postgres:16-alpine
    container_name: encore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore_dev_only
      POSTGRES_DB: encore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encore -d encore"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: encore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node Kafka in KRaft mode — no Zookeeper needed. Fine for local
  # dev; a multi-broker setup is a Week 16/17 (Scaling / Sharding) concern,
  # not a Week 1 one.
  kafka:
    image: bitnami/kafka:3.7
    container_name: encore-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Optional dev-only inspection tools — not part of the runtime system,
  # convenience only. Safe to comment out.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: encore-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

volumes:
  postgres_data:
  kafka_data:
