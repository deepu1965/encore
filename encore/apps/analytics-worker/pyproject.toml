[project]
name = "encore-analytics-worker"
version = "0.1.0"
description = "Background worker for analytics aggregation."
requires-python = ">=3.11"
dependencies = [
    "kafka-python-ng>=2.2",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "encore-common"
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"
