[project]
name = "encore-waiting-room"
version = "0.1.0"
description = "Virtual waiting room service for Encore flash-sale admission control."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "encore-common",
    "encore-event-contracts",
    "encore-kafka-client",
    "encore-id-generator",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "fakeredis>=2.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
