[project]
name = "encore-api-gateway"
version = "0.1.0"
description = "Encore V1 monolith entrypoint (Week 2 vertical slice). Splits into apps/inventory-service, apps/checkout-service, etc. starting Week 6 per docs/architecture/service-boundaries.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "encore-id-generator",
    "encore-event-contracts",
    "encore-kafka-client",
    "encore-hold-expiry",
    # encore-common is installed separately from ../../packages/common —
    # see README.md "Local development" for install order. Not declared
    # as a normal dependency here because it's a local path package and
    # this monorepo doesn't yet use a workspace tool (uv/poetry
    # workspaces) — see docs/decisions/0004-fake-bearer-token-week2-auth.md
    # for the general pattern of "documented shortcut, revisit later."
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
