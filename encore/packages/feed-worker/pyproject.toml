[project]
name = "encore-feed-worker"
version = "0.1.0"
description = "Worker for generating user feeds."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "encore-event-contracts",
    "encore-kafka-client",
    "encore-id-generator",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "fakeredis>=2.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
