[project]
name = "encore-id-generator"
version = "0.1.0"
description = "Snowflake-style 64-bit distributed ID generator for Encore services. Zero external dependencies — stdlib only."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
