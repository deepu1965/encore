[project]
name = "encore-cache"
version = "0.1.0"
description = "Redis-backed cache abstraction for Encore services — cache-aside pattern, TTL, consistent hashing."
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "fakeredis>=2.23"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
