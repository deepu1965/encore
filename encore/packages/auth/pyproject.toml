[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "encore-auth"
version = "0.1.0"
description = "Encore Auth JWT Package"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]
