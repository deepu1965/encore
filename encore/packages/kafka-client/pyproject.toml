[project]
name = "encore-kafka-client"
version = "0.1.0"
description = "Kafka producer and consumer abstractions for Encore services."
requires-python = ">=3.11"
dependencies = [
    "kafka-python>=2.0",
    "encore-event-contracts",
    "encore-id-generator",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
